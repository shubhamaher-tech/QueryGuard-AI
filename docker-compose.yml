services:
  postgres:
    image: postgres:16-alpine
    container_name: queryguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queryguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queryguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  workload-postgres:
    build:
      context: ./database/workload
      dockerfile: Dockerfile
    container_name: queryguard-workload-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: workload_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - workload_postgres_data:/var/lib/postgresql/data
      - ./database/workload:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workload_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: queryguard-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queryguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/queryguard
      WORKLOAD_DATABASE_URL: postgresql+psycopg2://workload_ro:workload_ro_pass@workload-postgres:5432/workload_db
      WORKLOAD_ADMIN_DATABASE_URL: postgresql+psycopg2://postgres:postgres@workload-postgres:5432/workload_db
      TPCH_BASE_DIR: /app/database/workload/tpch
      HMAC_TOKEN_SECRET: qg-telemetry-hmac-secret-salt-2026
      PROJECT_NAME: "QueryGuard AI"
      VERSION: "1.0.0"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_ENABLED: "true"
      OLLAMA_TIMEOUT_SECONDS: "45"
      REWRITE_IMPROVEMENT_THRESHOLD_PCT: "10.0"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/artifacts:/app/artifacts
      - ./backend/tests:/app/tests
      - ./database/workload/tpch:/app/database/workload/tpch
    depends_on:
      postgres:
        condition: service_healthy
      workload-postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  backend-ml:
    profiles: ["ml"]
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    container_name: queryguard-backend-ml
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/queryguard
      WORKLOAD_DATABASE_URL: postgresql+psycopg2://workload_ro:workload_ro_pass@workload-postgres:5432/workload_db
      HMAC_TOKEN_SECRET: qg-telemetry-hmac-secret-salt-2026
      PROJECT_NAME: "QueryGuard AI (ML Profile)"
      VERSION: "1.0.0"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_ENABLED: "true"
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      workload-postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: queryguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  workload_postgres_data:
  ollama_data:
