services:
  # QueryGuard FastAPI Backend
  - type: web
    name: queryguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queryguard-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PROJECT_NAME
        value: "QueryGuard AI"

  # QueryGuard React Frontend
  - type: web
    name: queryguard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: queryguard-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: queryguard-db
    databaseName: queryguard
    user: queryguard
    plan: free
